server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  # Cloudflare sits in front of production and caches static extensions by default; these headers
  # control both the CDN and browsers. The service worker, its registration helper, the app shell and
  # the manifest must never be cached, otherwise PWA updates (and push handlers) are delayed for hours.
  location = /sw.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }
  location = /registerSW.js {
    add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    try_files $uri =404;
  }
  location = /manifest.webmanifest {
    add_header Cache-Control "no-cache" always;
    try_files $uri =404;
  }
  location = /index.html {
    add_header Cache-Control "no-cache" always;
  }

  # Vite emits content-hashed files under /assets/: safe to cache forever.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable" always;
    try_files $uri =404;
  }

  location / {
    add_header Cache-Control "no-cache" always;
    try_files $uri /index.html;
  }

  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}
